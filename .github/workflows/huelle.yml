# Baut bei jedem Tag der Form YYYYMMDD.NN das signierte APK der Android-Hülle und hängt es als llm-post-TAG.apk an
# das Release dieses Tags; Obtainium liest die Fassung aus dem Tag. Fehlt das Release, legt der Lauf es mit dem
# Abschnitt aus CHANGELOG.md an. Den Tag pushst du mit deinem Konto: ein Tag aus einem Workflow startet keinen Lauf.
name: Android-Hülle

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9][0-9]']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Tag gleich js/version.js
        run: |
          v=$(sed -nE "s/.*VERSION = '([0-9.]+)'.*/\1/p" js/version.js)
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu js/version.js ($v)"
            exit 1
          fi

      - name: Signierschlüssel bereitlegen
        env:
          SIGNATUR_P12: ${{ secrets.SIGNATUR_P12 }}
          SIGNATUR_PASSWORT: ${{ secrets.SIGNATUR_PASSWORT }}
        run: |
          if [ -z "$SIGNATUR_P12" ] || [ -z "$SIGNATUR_PASSWORT" ]; then
            echo "::error::Die Secrets SIGNATUR_P12 und SIGNATUR_PASSWORT fehlen (docs/entwicklung/huelle.md)"
            exit 1
          fi
          d="$RUNNER_TEMP/signatur"
          mkdir -m 700 "$d"
          printf '%s' "$SIGNATUR_P12" | base64 -d > "$d/llm-post.p12"
          printf '%s' "$SIGNATUR_PASSWORT" > "$d/passwort"
          chmod 600 "$d/llm-post.p12" "$d/passwort"
          echo "LLMPOST_SIGNATUR=$d" >> "$GITHUB_ENV"

      - name: Testen und bauen
        run: android/gradlew -p android --no-daemon testDebugUnitTest assembleRelease

      - name: Signatur prüfen
        run: |
          b=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$b/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "llm-post-$GITHUB_REF_NAME.apk"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            awk -v v="$GITHUB_REF_NAME" '/^## /{ if (f) exit; if (index($0, v)) { f = 1; next } } f' CHANGELOG.md > notizen.md
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notizen.md
          fi
          gh release upload "$GITHUB_REF_NAME" "llm-post-$GITHUB_REF_NAME.apk" --clobber

      - name: Signierschlüssel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/signatur"
